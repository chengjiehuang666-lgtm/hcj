name: multiagent

# 说明：本文件只起 PostgreSQL(pgvector) 与 Redis 两个依赖服务。
# 应用容器见 docker-compose.app.yml（W12 单机部署）；开发阶段应用可直接跑在宿主机。
#
# 依赖：Docker Desktop / Docker Engine（本机已安装并验证）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiagent
      POSTGRES_PASSWORD: multiagent
      POSTGRES_DB: multiagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本仅在数据卷为空时执行一次（见 docker/initdb/）
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiagent -d multiagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
