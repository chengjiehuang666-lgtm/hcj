[project]
name = "multiagent"
version = "0.1.0"
description = "企业级多 Agent 智能协作平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 编排内核，阶段一 W2 起需要（LangGraph + 图状态持久化到 PostgreSQL）
agents = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
]
# 知识库 RAG：本地 embedding（fastembed + ONNX），无需在线服务
rag = [
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入惯用法就是 Depends(...) 作为参数默认值
"src/multiagent/api/app.py" = ["B008"]
